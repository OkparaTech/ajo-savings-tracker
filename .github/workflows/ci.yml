name: Financial integrity checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ajo
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: ajo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ajo -d ajo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://ajo:test-only-password@localhost:5432/ajo_test
      TEST_DATABASE_URL: postgresql://ajo:test-only-password@localhost:5432/ajo_test?connection_limit=5
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx prisma validate
      - run: npm run prisma:deploy
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: server/test-results/
